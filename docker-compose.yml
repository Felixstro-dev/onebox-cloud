name: onebox

services:
  onebox:
    # Fertiges Multi-Arch-Image (amd64, arm64) aus GitHub Container Registry.
    # Lokal bauen: den build-Block einkommentieren und `image:` auskommentieren.
    image: ghcr.io/felixstro-dev/onebox-cloud:latest
    # build: .
    container_name: onebox
    restart: on-failure:5
    labels:
      # Nur dieses Label erlaubt Watchtower, den Container zu aktualisieren.
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8090:8080"
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=${DATA_DIR:-/data}
      - FILES_DIR=${FILES_DIR:-/data/files}
      # Hinter HTTPS/Reverse-Proxy auf 1 setzen.
      - SECURE_COOKIES=${SECURE_COOKIES:-0}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - BASE_URL=${BASE_URL:-}
      # Optional: verhindert die Ersteinrichtung durch Dritte (min. 16 Zeichen).
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Versionsnummer für die Update-Prüfung. Wird normalerweise aus dem
      # Image übernommen; nur zum Testen überschreiben.
      # - ONEB_VERSION=0.1.0
      # Interner Updater (Watchtower). Das Token schützt die Update-API.
      - UPDATE_API_URL=http://onebox-updater:8080/v1/update
      - UPDATE_API_TOKEN=${UPDATE_API_TOKEN:-change-me-to-a-long-random-string}
      - UPDATE_CHECK_REPO=${UPDATE_CHECK_REPO:-Felixstro-dev/onebox-cloud}
    volumes:
      # Daten (SQLite-DB, Uploads, Thumbnails, Snapshots) bleiben auf dem Host.
      # ONEBOX_DATA_PATH und DATA_DIR gemeinsam ändern, wenn der Datenordner
      # auf dem Host oder im Container an einen anderen Ort verschoben wird.
      # Der Entrypoint initialisiert den Mount und setzt ihn auf node:node (1000:1000),
      # bevor der eigentliche Prozess als Nicht-Root gestartet wird.
      - ${ONEBOX_DATA_PATH:-./data}:${DATA_DIR:-/data}
      # Optional: zusätzliche Festplatte einbinden, z. B. eine große HDD.
      # Danach in Onebox unter „Speicher“ als Speicherort hinzufügen.
      # - /mnt/backup-hdd:/mnt/backup-hdd

  # Aktualisiert Onebox auf Knopfdruck. Der Container läuft dauerhaft, prüft
  # aber nur, wenn Onebox über die HTTP-API ein Update anstößt.
  onebox-updater:
    # Gepflegte Watchtower-Fork mit Docker-Client für moderne Engines.
    # Der Digest gehört zu nickfedor/watchtower:1.24.0 (verifiziert am 05.11.2026).
    image: nickfedor/watchtower:1.24.0@sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    container_name: onebox-updater
    restart: unless-stopped
    command:
      - --http-api-update
      - --http-api-token
      - ${UPDATE_API_TOKEN:-change-me-to-a-long-random-string}
      - --api-version
      - ${DOCKER_API_VERSION:-1.44}
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --stop-timeout
      - 5m
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Nicht nach außen veröffentlichen – nur der Onebox-Container spricht
    # über das interne Compose-Netzwerk mit dem Updater.
    expose:
      - "8080"
