<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bottom-Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:wght@400&display=swap">
<style>
/*@inline tokens.css*/
/*@inline motion.css*/
/*@inline components.css*/
html, body { height: 100%; background: var(--color-bg-deep); overflow: hidden; }
.app { height: 100%; background: var(--color-bg-base); display: grid; align-content: center; justify-items: center; gap: var(--space-6); padding: var(--space-6); text-align: center; }
.app h1 { font-size: var(--text-hero); }
.app p { color: var(--color-text-secondary); margin: 0; }
.list { display: grid; gap: var(--space-1); align-content: start; }
</style>
</head>
<body>
<!--@inline icons.svg-->
<main class="app behind" id="app">
  <h1 class="anim-rise">Von unten, wie auf dem iPhone</h1>
  <p>Zieh das Sheet am Griff nach oben oder unten. Lass es mit Schwung los.</p>
  <button class="btn btn--primary pressable" id="open"><svg class="icon"><use href="#i-sparkles"/></svg>Sheet öffnen</button>
</main>

<div class="sheet-scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-labelledby="st">
  <div class="sheet__grab" id="grab"><h2 class="sheet__title" id="st">Neue Aktion</h2></div>
  <div class="sheet__body list">
    <button class="nav-item pressable"><svg class="icon"><use href="#i-pencil"/></svg>Text schreiben</button>
    <button class="nav-item pressable"><svg class="icon"><use href="#i-code"/></svg>Code generieren</button>
    <button class="nav-item pressable"><svg class="icon"><use href="#i-presentation"/></svg>Folien erstellen</button>
    <button class="nav-item pressable"><svg class="icon"><use href="#i-file-text"/></svg>Dokument zusammenfassen</button>
    <button class="nav-item pressable"><svg class="icon"><use href="#i-download"/></svg>Exportieren</button>
  </div>
</section>

<script>
/*@inline sheet.js*/
const sheet = new Sheet(document.getElementById('sheet'), {
  detents: [.5, 1], handle: document.getElementById('grab'),
  scrim: document.getElementById('scrim'), behind: document.getElementById('app')
});
document.getElementById('open').onclick = () => sheet.open();
</script>
</body>
</html>
